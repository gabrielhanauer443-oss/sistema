<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balcão</title>
<meta name="description" content="Gestão para lojas de iPhone e eletrônicos: estoque por IMEI, vendas, simulador de taxas e financeiro.">
<meta name="theme-color" content="#1d1d21">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>
<body>
<div id="auth"><div class="auth-wrap"><section class="auth-brand"><h1>Carregando…</h1></section><section class="auth-card"></section></div></div>
<div class="app" id="app" hidden>
  <aside class="side" aria-label="Menu">
    <div class="brand"><span class="mark-box" id="brand-mark"></span><div><b id="brand-nome"></b><small id="brand-sub"></small></div></div>
    <nav id="nav" style="display:flex;flex-direction:column;gap:2px"></nav>
    <div class="conn"><span class="dot" id="dot"></span><span id="conn">Conectando…</span></div>
    <div class="conta" id="conta"></div>
  </aside>
  <main>
    <div class="wrap">
      <div class="mobtop"><span class="mark-box" id="mob-mark"></span><b id="mob-nome"></b><span class="dot" id="dot2" style="margin:0 0 0 auto"></span><button class="link" type="button" id="mob-conta" onclick="abrirConta()">Conta</button></div>
      <div id="banner"></div>
      <div id="view" class="stack"></div>
    </div>
  </main>
  <nav class="mobnav" id="mobnav" aria-label="Menu"></nav>
</div>
<dialog id="modal"></dialog>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
